[package]
name = "zayan-image-magic"
version = "0.1.0"
description = "Zayan Image Magic — local image format converter"
authors = ["Syed Faraz Ahmad"]
edition = "2021"

[lib]
name = "zayan_image_magic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "gif",
  "bmp",
  "tiff",
  "webp",
  "rayon",
] }
webp = "0.3"
ravif = "0.11"
rgb = "0.8"
imgref = "1"
kamadak-exif = "0.6"
thiserror = "2"
